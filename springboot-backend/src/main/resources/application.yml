spring:
  redis:
    # Spring Boot 2.7 accepts redis://[:password@]host:port/database here.
    # When empty, the individual REDIS_HOST/PORT/PASSWORD settings below apply.
    url: ${REDIS_URL:}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    ssl: ${REDIS_SSL:false}
    timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    # Set DB_URL for an external MySQL or PostgreSQL server. The legacy DB_* values remain supported.
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gost}?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      max-lifetime: 500000
      connection-timeout: 30000
      idle-timeout: 600000
      max-pool-size: 20
      minimum-idle: 5
      pool-name: HikariCP
      auto-commit: true
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 6365
  tomcat:
    uri-encoding: UTF-8
    max-thread: 800
    max-connections: 2000
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always

mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
  global-config:
    db-config:
      # PostgreSQL external deployments set these to '"%s"' so the legacy user table is quoted.
      table-format: ${MYBATIS_TABLE_FORMAT:}
      column-format: ${MYBATIS_COLUMN_FORMAT:}
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt-secret: ${JWT_SECRET}
log-dir: ${LOG_DIR:logs}

mail:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail.smtp.auth: ${SMTP_AUTH:true}
    mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

tms:
  auth:
    verification-expire-seconds: ${VERIFY_CODE_EXPIRE_SECONDS:600}
    verification-cooldown-seconds: ${VERIFY_CODE_COOLDOWN_SECONDS:60}
    reset-url-base: ${TMS_RESET_URL_BASE:${PUBLIC_BASE_URL:http://localhost:6366}}


captcha:
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000
